<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>403 · Access Denied — Cartum</title>
    <meta
      name="description"
      content="Access to this page is restricted. Contact support if you need immediate assistance."
    />
    <meta name="robots" content="noindex, nofollow" />
    <link rel="stylesheet" href="css/styles.css" />
    <script src="js/i18n.js" defer></script>
    <script src="js/main.js" defer></script>
  </head>
  <body>
    <div class="page" data-od-id="page-403">
      <header class="logo" data-od-id="logo-403">
        <img
          class="logo-mark"
          src="assets/icons/cartum-logo.svg"
          width="120"
          height="21"
          alt="Cartum"
        />
      </header>

      <main class="main" data-od-id="main-403">
        <div class="icon" data-od-id="icon-403">
          <img
            class="icon-mark"
            src="assets/icons/gear.svg"
            width="48"
            height="48"
            alt=""
          />
        </div>

        <div class="text" data-od-id="text-403">
          <div class="title-group">
            <p class="code" data-i18n="403_code">403</p>
            <h1 class="title" data-i18n="403_title">Access Denied</h1>
          </div>
          <p class="body" data-i18n="403_sub">
            Our security systems have flagged this connection. To protect our
            merchants and their customers, we've restricted access from your
            current IP or location.
          </p>
        </div>

        <button
          class="btn"
          type="button"
          id="cta-support"
          data-action="support"
          data-od-id="cta-403"
        >
          <img
            class="btn-ico"
            src="assets/icons/support.svg"
            width="16"
            height="16"
            alt=""
          />
          <span class="btn-label" data-i18n="403_btn">Contact Support</span>
        </button>

        <section
          class="what-box"
          aria-labelledby="what-title"
          data-od-id="what-box-403"
        >
          <div class="what" data-od-id="what-403">
            <h2 class="what-title" id="what-title" data-i18n="what_title">
              What can I do?
            </h2>
            <p class="what-body" data-i18n="403_what">
              If you need immediate assistance, please contact us. We apologize
              for any inconvenience.
            </p>
          </div>
        </section>
      </main>

      <footer class="lang" data-od-id="lang-403">
        <button
          class="lang-btn"
          type="button"
          id="lang-trigger"
          aria-haspopup="listbox"
          aria-expanded="false"
          aria-controls="lang-menu"
          data-od-id="lang-trigger-403"
        >
          <img
            class="lang-ico"
            src="assets/icons/globe.svg"
            width="16"
            height="16"
            alt=""
          />
          <span class="lang-label">English</span>
          <img
            class="lang-chev"
            src="assets/icons/chevron-down.svg"
            width="16"
            height="16"
            alt=""
          />
        </button>
        <ul class="lang-menu" id="lang-menu" role="listbox" aria-label="Language">
          <li role="presentation">
            <button
              class="lang-opt"
              type="button"
              role="option"
              data-lang="en"
              aria-selected="true"
            >
              English
            </button>
          </li>
          <li role="presentation">
            <button
              class="lang-opt"
              type="button"
              role="option"
              data-lang="uk"
              aria-selected="false"
            >
              Українська
            </button>
          </li>
          <li role="presentation">
            <button
              class="lang-opt"
              type="button"
              role="option"
              data-lang="ru"
              aria-selected="false"
            >
              Русский
            </button>
          </li>
        </ul>
      </footer>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </body>
</html>
