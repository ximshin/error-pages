<html lang="en">
  <head>

    <style>
      /* ═══════════════════════════════════════════════════════════════════════
         403 · Access Denied — Cartum
         Tokens and component metrics read from Figma (102-5357 / 128-5900).
         1 tokens · 2 reset & base · 3 layout · 4 components · 5 responsive
         ═══════════════════════════════════════════════════════════════════════ */

      /* ── 1. Design tokens ── */
      :root {
        --bg: #ffffff;
        --fg: #222222; /* title, button fill, control labels */
        --logo: #1c1c1c; /* wordmark */
        --muted: rgba(0, 0, 0, 0.5); /* code label + body copy */
        --surface: rgba(0, 0, 0, 0.03); /* what-box card */
        --line: #e2e2e2; /* menu border */

        --font-ui: Arial, Helvetica, sans-serif;
        --font-lang:
          "Inter", system-ui, -apple-system, "Segoe UI", Arial, sans-serif;

        --radius: 8px;
        --radius-sm: 6px;

        /* Figma frame inset 64/24 and main lead 80 — fluid between breakpoints */
        --page-inset-block: clamp(32px, 5vh, 64px);
        --page-inset-inline: clamp(16px, 4vw, 24px);
        --gap: 24px;
        --main-w: 480px;
        --main-lead: 32px;
      }

      /* ── 2. Reset & base ── */
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html {
        height: 100%;
      }
      body {
        min-height: 100%;
        background: var(--bg);
        color: #000;
        font-family: var(--font-ui);
        -webkit-font-smoothing: antialiased;
      }
      svg {
        display: block;
      }
      button {
        font: inherit;
        color: inherit;
      }
      /* hidden icon sprite */
      .sprite {
        position: absolute;
        width: 0;
        height: 0;
        overflow: hidden;
      }

      /* ── 3. Layout ── */
      /* One centred column: wordmark on top, content in the middle, language
         control at the bottom. Never wider than the 480 Figma column. */
      .page {
        min-height: 100vh;
        min-height: 100dvh;
        padding: var(--page-inset-block) var(--page-inset-inline);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: var(--gap);
      }

      /* ── 4. Components ── */

      /* 4.1 logotypes — 183×13 cartum + horoshop lockup, fill #1c1c1c */
      .logo {
        height: 13px;
        flex: 0 0 auto;
        display: flex;
        align-items: center;
      }
      .logo-mark {
        width: 183px;
        height: 13px;
        color: var(--logo);
      }

      /* 4.2 main — 480 column, lead 32, gap 24 */
      .main {
        flex: 1 1 auto;
        width: min(var(--main-w), 100%);
        padding-top: var(--main-lead);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: var(--gap);
      }

      /* 4.3 gear icon — 48×48, stroke #000 @30% */
      .icon {
        width: 48px;
        height: 48px;
        flex: 0 0 auto;
      }

      /* 4.4 text — gap 12, title group gap 0 */
      .text {
        width: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
      }
      .title-group {
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      .code {
        font-size: 18px;
        font-weight: 400;
        line-height: 24.3px;
        color: var(--muted);
        text-align: center;
      }
      .title {
        font-size: 24px;
        font-weight: 700;
        line-height: 32.4px;
        color: var(--fg);
        text-align: center;
        text-wrap: balance;
      }
      .body {
        width: 100%;
        font-size: 16px;
        font-weight: 400;
        line-height: 21.6px;
        color: var(--muted);
        text-align: center;
        text-wrap: pretty;
      }

      /* 4.5 primary action — h48, r8, fill #222, pad 12/16, gap 8 */
      .btn {
        flex: 0 0 auto;
        height: 48px;
        padding: 12px 16px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        border: 0;
        border-radius: var(--radius);
        background: var(--fg);
        color: #fff;
        cursor: pointer;
        transition: background 0.12s;
      }
      .btn-ico {
        width: 16px;
        height: 16px;
        flex: 0 0 auto;
        display: block;
      }
      .btn-label {
        font-family: var(--font-ui);
        font-size: 16px;
        font-weight: 400;
        line-height: 24px;
        color: #fff;
        white-space: nowrap;
      }
      .btn:hover {
        background: #3b3b3b;
      }
      .btn:active {
        background: #151515;
      }
      .btn:focus-visible {
        outline: 1px solid #222222;
        outline-offset: 2px;
      }

      /* 4.6 what-box — lead 24, card r8 on #000 @3%, pad 16/20/20/20, gap 8 */
      .what-box {
        width: 100%;
        flex: 0 0 auto;
        padding-top: var(--gap);
      }
      .what {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 8px;
        padding: 16px 20px 20px;
        border-radius: var(--radius);
        background: var(--surface);
      }
      .what-title {
        font-family: var(--font-ui);
        font-size: 16px;
        font-weight: 700;
        line-height: 21.6px;
        color: var(--fg);
      }
      .what-body {
        width: 100%;
        font-family: var(--font-ui);
        font-size: 16px;
        font-weight: 400;
        line-height: 21.6px;
        color: var(--fg);
        text-align: left;
        text-wrap: pretty;
      }

      /* 4.7 language control — 120×40 ghost button + listbox above it */
      .lang {
        flex: 0 0 auto;
        position: relative;
      }
      .lang-btn {
        height: 40px;
        padding: 12px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        border: 0;
        border-radius: var(--radius);
        background: transparent;
        cursor: pointer;
        transition: background 0.12s;
      }
      .lang-btn:hover {
        background: rgba(0, 0, 0, 0.05);
      }
      .lang-btn:focus-visible {
        outline: 1px solid #222222;
        outline-offset: 2px;
      }
      .lang-ico,
      .lang-chev {
        width: 16px;
        height: 16px;
        flex: 0 0 auto;
        display: block;
      }
      .lang-chev {
        transition: transform 0.15s;
      }
      .lang-btn[aria-expanded="true"] .lang-chev {
        transform: rotate(180deg);
      }
      .lang-label {
        font-family: var(--font-lang);
        font-size: 14px;
        font-weight: 400;
        line-height: 16px;
        color: var(--fg);
        white-space: nowrap;
      }
      .lang-menu {
        position: absolute;
        left: 50%;
        bottom: calc(100% + 4px);
        transform: translateX(-50%);
        min-width: 164px;
        padding: 4px;
        background: #fff;
        border: 1px solid var(--line);
        border-radius: var(--radius);
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
        list-style: none;
        display: none;
        z-index: 20;
      }
      .lang-menu.is-open {
        display: block;
      }
      .lang-opt {
        width: 100%;
        height: 32px;
        padding: 0 10px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        border: 0;
        border-radius: var(--radius-sm);
        background: transparent;
        cursor: pointer;
        font-family: var(--font-lang);
        font-size: 14px;
        line-height: 16px;
        color: var(--fg);
        text-align: left;
      }
      .lang-opt:hover {
        background: #ededed;
        color: #000;
      }
      .lang-opt:focus-visible {
        outline: 1px solid #222222;
        outline-offset: -2px;
      }
      .lang-opt[aria-selected="true"]::after {
        content: "";
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--fg);
      }

      /* 4.8 toast — feedback for the support action */
      .toast {
        position: fixed;
        left: 50%;
        bottom: 24px;
        transform: translate(-50%, 90px);
        z-index: 80;
        padding: 12px 20px;
        background: #111;
        color: #fff;
        border-radius: var(--radius);
        font-family: var(--font-lang);
        font-size: 13px;
        line-height: 16px;
        white-space: nowrap;
        opacity: 0;
        pointer-events: none;
        transition:
          opacity 0.22s,
          transform 0.22s;
      }
      .toast.is-on {
        opacity: 1;
        transform: translate(-50%, 0);
      }

      /* ── 5. Responsive ── */
      /* Phones: the action goes full width, the language menu and its hit area
         grow to the 44px touch minimum. Same tokens as the wide layout. */
      @media (max-width: 480px) {
        .btn {
          width: 100%;
          display: flex;
        }
        .lang-menu {
          min-width: 180px;
        }
        .lang-btn {
          position: relative;
        }
        .lang-btn::after {
          content: "";
          position: absolute;
          left: 0;
          right: 0;
          top: -2px;
          bottom: -2px;
        }
        .toast {
          max-width: calc(100vw - 32px);
          white-space: normal;
          text-align: center;
        }
      }

      /* From tablets up there is room to centre the column between the wordmark
         and the language control, the way the 1280×800 Figma frame reads. */
      @media (min-width: 481px) {
        .main {
          justify-content: center;
          padding-top: 0;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        * {
          transition: none !important;
        }
      }
    </style>

    <script>
      /* Language switching (persisted), the language listbox and the support
         action's toast. No inline handlers in the markup. */
      (function () {
        "use strict";

        /* ── copy: English is the Figma source; uk / ru are localised runs.
           The last two words of every paragraph are bound with U+00A0 so a
           line never ends on a lone word. ── */
      var LANGS = [
        { id: "en", name: "English" },
        { id: "uk", name: "Українська" },
        { id: "ru", name: "Русский" },
      ];
      var I18N = {
        en: {
          "403_code": "403",
          "403_title": "Access Denied",
          "403_sub": "Our security systems have flagged this connection. To protect our merchants and their customers, we've restricted access from your current IP or location.",
          "403_btn": "Contact Support",
          "403_what": "If you need immediate assistance, please contact us. We apologize for any inconvenience.",
          "403_toast": "Opening support…",
          "what_title": "What can I do?",
        },
        uk: {
          "403_code": "403",
          "403_title": "Доступ заборонено",
          "403_sub": "Наші системи безпеки позначили це з’єднання. Щоб захистити наших продавців та їхніх покупців, ми обмежили доступ з вашої поточної IP-адреси або локації.",
          "403_btn": "Звернутися до підтримки",
          "403_what": "Якщо вам потрібна термінова допомога, зверніться до нас. Просимо вибачення за незручності.",
          "403_toast": "Відкриваємо підтримку…",
          "what_title": "Що можна зробити?",
        },
        ru: {
          "403_code": "403",
          "403_title": "Доступ запрещён",
          "403_sub": "Наши системы безопасности отметили это соединение. Чтобы защитить наших продавцов и их покупателей, мы ограничили доступ с вашего текущего IP-адреса или местоположения.",
          "403_btn": "Связаться с поддержкой",
          "403_what": "Если вам нужна срочная помощь, свяжитесь с нами. Приносим извинения за неудобства.",
          "403_toast": "Открываем поддержку…",
          "what_title": "Что можно сделать?",
        },
      };

        var STORE_KEY = "hs-err-lang";
        var TOAST_MS = 2000;

        var langHost = document.querySelector(".lang");
        var langBtn = document.getElementById("lang-trigger");
        var langMenu = document.getElementById("lang-menu");
        var langLabel = document.querySelector(".lang-label");
        var ctaBtn = document.getElementById("cta-support");
        var toastEl = document.getElementById("toast");

        function read(key) {
          try {
            return localStorage.getItem(key);
          } catch (err) {
            return null;
          }
        }
        function write(key, value) {
          try {
            localStorage.setItem(key, value);
          } catch (err) {
            /* private mode — the page still works, the choice just isn't kept */
          }
        }

        var lang = read(STORE_KEY);
        if (!I18N[lang]) {
          lang = "en";
        }

        function t(key) {
          return (
            (I18N[lang] && I18N[lang][key]) || (I18N.en && I18N.en[key]) || ""
          );
        }

        function setLang(next) {
          if (!I18N[next]) {
            return;
          }
          lang = next;
          write(STORE_KEY, next);
          document.documentElement.lang = next;

          Array.prototype.forEach.call(
            document.querySelectorAll("[data-i18n]"),
            function (el) {
              el.textContent = t(el.dataset.i18n);
            },
          );

          var found =
            LANGS.filter(function (item) {
              return item.id === next;
            })[0] || LANGS[0];
          if (langLabel && found) {
            langLabel.textContent = found.name;
          }

          Array.prototype.forEach.call(
            document.querySelectorAll(".lang-opt"),
            function (opt) {
              opt.setAttribute("aria-selected", String(opt.dataset.lang === next));
            },
          );
        }

        function openMenu() {
          langMenu.classList.add("is-open");
          langBtn.setAttribute("aria-expanded", "true");
        }
        function closeMenu() {
          langMenu.classList.remove("is-open");
          langBtn.setAttribute("aria-expanded", "false");
        }
        function isOpen() {
          return langMenu.classList.contains("is-open");
        }

        if (langBtn && langMenu) {
          langBtn.addEventListener("click", function (event) {
            event.stopPropagation();
            if (isOpen()) {
              closeMenu();
            } else {
              openMenu();
            }
          });

          Array.prototype.forEach.call(
            langMenu.querySelectorAll(".lang-opt"),
            function (opt) {
              opt.addEventListener("click", function () {
                setLang(opt.dataset.lang);
                closeMenu();
                langBtn.focus();
              });
            },
          );

          document.addEventListener("click", function (event) {
            if (isOpen() && !langHost.contains(event.target)) {
              closeMenu();
            }
          });

          document.addEventListener("keydown", function (event) {
            if (event.key === "Escape" && isOpen()) {
              closeMenu();
              langBtn.focus();
            }
          });
        }

        var toastTimer;
        function toast(message) {
          if (!toastEl || !message) {
            return;
          }
          toastEl.textContent = message;
          toastEl.classList.add("is-on");
          clearTimeout(toastTimer);
          toastTimer = setTimeout(function () {
            toastEl.classList.remove("is-on");
          }, TOAST_MS);
        }

        if (ctaBtn) {
          ctaBtn.addEventListener("click", function () {
            toast(t("403_toast"));
          });
        }

        setLang(lang);
      })();
    </script>
  </body>
</html>
