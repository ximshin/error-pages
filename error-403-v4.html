<html lang="en">

    <style>
      :root {
        --bg: #fff;
        --fg: #222222;
        --logo: #1c1c1c;
        --muted: rgba(0, 0, 0, 0.5);
        --surface: rgba(0, 0, 0, 0.03);
        --sign-color: rgba(0, 0, 0, 0.1);
        --line: #e2e2e2;
        --font-ui: Arial, Helvetica, sans-serif;
        --font-lang:
          "Inter", system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
        --radius: 8px;
        --page-inset-block: clamp(32px, 5vh, 64px);
        --page-inset-inline: clamp(16px, 4vw, 24px);
        --gap: 24px;
        --main-w: 480px;
        --main-lead: 32px;
        --sign: "⚠";
      }
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html {
        height: 100%;
      }
      body {
        min-height: 100%;
        background: var(--bg);
        color: #000;
        font-family: var(--font-ui);
        -webkit-font-smoothing: antialiased;
      }
      svg {
        display: block;
      }
      button {
        font: inherit;
        color: inherit;
      }
      .sprite {
        position: absolute;
        width: 0;
        height: 0;
        overflow: hidden;
      }
      .page {
        min-height: 100vh;
        min-height: 100dvh;
        padding: var(--page-inset-block) var(--page-inset-inline);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: var(--gap);
      }
      .logo {
        height: 13px;
        flex: 0 0 auto;
        display: flex;
        align-items: center;
      }
      .logo-mark {
        width: 183px;
        height: 13px;
        color: var(--logo);
      }
      .main {
        flex: 1 1 auto;
        width: min(var(--main-w), 100%);
        padding-top: var(--main-lead);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: var(--gap);
      }
      .icon {
        width: 48px;
        height: 48px;
        flex: 0 0 auto;
      }
      .text {
        width: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
      }
      .title-group {
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      .code {
        font-size: 18px;
        font-weight: 400;
        line-height: 24.3px;
        color: var(--muted);
        text-align: center;
      }
      .title {
        font-size: 24px;
        font-weight: 700;
        line-height: 32.4px;
        color: var(--fg);
        text-align: center;
        text-wrap: balance;
      }
      .body {
        width: 100%;
        font-size: 16px;
        font-weight: 400;
        line-height: 21.6px;
        color: var(--muted);
        text-align: center;
        text-wrap: pretty;
      }
      .btn {
        flex: 0 0 auto;
        height: 48px;
        padding: 12px 16px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        border: 0;
        border-radius: var(--radius);
        background: var(--fg);
        color: #fff;
        cursor: pointer;
        transition: background 0.12s;
      }
      .btn-ico {
        width: 16px;
        height: 16px;
        flex: 0 0 auto;
        display: block;
      }
      .btn-label {
        font-size: 16px;
        font-weight: 400;
        line-height: 24px;
        color: #fff;
        white-space: nowrap;
      }
      .btn:hover {
        background: #3b3b3b;
      }
      .btn:active {
        background: #151515;
      }
      .btn:focus-visible {
        outline: 1px solid #222222;
        outline-offset: 2px;
      }
      .what-box {
        width: 100%;
        flex: 0 0 auto;
        padding-top: var(--gap);
      }
      .what {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 8px;
        padding: 16px 20px 20px;
        border-radius: var(--radius);
        background: var(--surface);
      }
      .what-title {
        font-size: 16px;
        font-weight: 700;
        line-height: 21.6px;
        color: var(--fg);
      }
      .what-body {
        width: 100%;
        font-size: 16px;
        font-weight: 400;
        line-height: 21.6px;
        color: var(--fg);
        text-align: left;
        text-wrap: pretty;
      }
      .translate {
        flex: 0 0 auto;
        min-height: 40px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #google_translate_element {
        line-height: 1;
      }
      .translate-note {
        display: none;
        font-family: var(--font-lang);
        font-size: 13px;
        line-height: 16px;
        color: var(--muted);
      }
      .translate.is-offline .translate-note {
        display: block;
      }
      body {
        top: 0 !important;
      }
      body > .skiptranslate,
      .VIpgJd-ZVi9od-ORHb-OEVmcd,
      .goog-te-banner-frame,
      #goog-gt-tt,
      .goog-te-balloon-frame {
        display: none !important;
      }
      .warning-sign {
        font-size: 64px;
        color: var(--sign-color);
      }
      .warning-sign::before {
        content: var(--sign);
      }

      @media (max-width: 480px) {
        .btn {
          width: 100%;
          display: flex;
        }
        .translate {
          width: 100%;
        }
        .goog-te-gadget {
          justify-content: center;
        }
        .goog-te-gadget .goog-te-combo {
          min-width: 164px;
        }
      }
      @media (min-width: 481px) {
        .main {
          justify-content: center;
          padding-top: 0;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        * {
          transition: none !important;
        }
      }
    </style>
  </head>
